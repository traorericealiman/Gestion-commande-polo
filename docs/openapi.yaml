openapi: 3.0.3
info:
  title: API Polo ESATIC
  version: 1.0.0
  description: 'API de commande de polos. Partie publique : catalogue, commande, suivi.
    Partie gestion : trésorières et administrateur (authentification JWT).'
paths:
  /api/v1/auth/connexion/:
    post:
      operationId: v1_auth_connexion_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Se connecter
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/deconnexion/:
    post:
      operationId: v1_auth_deconnexion_create
      summary: Se déconnecter
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeconnexionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeconnexionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeconnexionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Déconnecté
  /api/v1/auth/moi/:
    get:
      operationId: v1_auth_moi_retrieve
      summary: Utilisateur connecté
      tags:
      - Authentification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moi'
          description: ''
  /api/v1/auth/rafraichir/:
    post:
      operationId: v1_auth_rafraichir_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      summary: Rafraîchir le jeton d'accès
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/catalogue/:
    get:
      operationId: v1_catalogue_retrieve
      description: Tout ce dont le formulaire de commande a besoin, en un seul appel.
      summary: Catalogue et paramètres de vente
      tags:
      - Public
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogue'
          description: ''
  /api/v1/commandes/:
    post:
      operationId: v1_commandes_create
      description: |-
        [À FAIRE] Enregistre une commande au statut EN_ATTENTE.

        Étapes attendues (dans une transaction) :
          1. refuser si les ventes sont fermées (VentesFermees) ;
          2. vérifier quantité ≤ ParametresVente.quantite_max_par_ligne et taille non épuisée ;
          3. calculer les prix avec catalogue.services.prix_unitaire (jamais depuis le client) ;
          4. créer Commande, LigneCommande(s), Paiement, Capture (empreinte SHA-256) ;
          5. générer le code de suivi (services.generer_code_suivi) ;
          6. créer l'Evenement SOUMETTRE et envoyer l'accusé de réception.
      summary: Passer une commande
      tags:
      - Public
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CommandeCreationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeCreee'
          description: ''
        '400':
          description: Données invalides
        '403':
          description: Ventes fermées
  /api/v1/gestion/commandes/:
    get:
      operationId: v1_gestion_commandes_list
      description: |-
        [FAIT] Liste paginée, filtrable et cherchable.

        Tri par défaut : commandes en attente d'abord, puis les autres ; dans
        chaque groupe, de la plus ancienne à la plus récente. `?ordering=` le remplace.
      summary: Lister les commandes
      parameters:
      - in: query
        name: date_max
        schema:
          type: string
          format: date
      - in: query
        name: date_min
        schema:
          type: string
          format: date
      - in: query
        name: manches
        schema:
          type: string
          enum:
          - COURTES
          - LONGUES
        description: |-
          * `COURTES` - Manches courtes
          * `LONGUES` - Manches longues
      - in: query
        name: modele
        schema:
          type: string
          enum:
          - LICENCE
          - MASTER
        description: |-
          * `LICENCE` - Licence
          * `MASTER` - Master
      - in: query
        name: moyen_paiement
        schema:
          type: string
          enum:
          - MOOV_MONEY
          - MTN_MONEY
          - ORANGE_MONEY
          - WAVE
        description: |-
          * `WAVE` - Wave
          * `ORANGE_MONEY` - Orange Money
          * `MTN_MONEY` - MTN Money
          * `MOOV_MONEY` - Moov Money
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: statut
        schema:
          type: string
          enum:
          - A_CORRIGER
          - CLOTUREE
          - EN_ATTENTE
          - POLO_DISPONIBLE
          - REFUSEE
          - REMIS
          - VALIDEE
        description: |-
          * `EN_ATTENTE` - En attente de vérification
          * `A_CORRIGER` - À corriger
          * `VALIDEE` - Validée
          * `POLO_DISPONIBLE` - Polo disponible
          * `REMIS` - Remis
          * `REFUSEE` - Refusée
          * `CLOTUREE` - Clôturée
      - in: query
        name: taille
        schema:
          type: string
          enum:
          - L
          - M
          - S
          - XL
          - XXL
        description: |-
          * `S` - S
          * `M` - M
          * `L` - L
          * `XL` - XL
          * `XXL` - XXL
      - in: query
        name: version
        schema:
          type: string
          enum:
          - BRODE
          - SIMPLE
        description: |-
          * `SIMPLE` - Simple
          * `BRODE` - Brodé
      tags:
      - Gestion
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommandeListeList'
          description: ''
  /api/v1/gestion/commandes/{id}/:
    get:
      operationId: v1_gestion_commandes_retrieve
      description: |-
        [À FAIRE] Fiche complète d'une commande, avec alertes calculées :
        même empreinte de capture ou même référence de transaction sur une autre
        commande, stock insuffisant.
      summary: Fiche d'une commande
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeDetail'
          description: ''
    patch:
      operationId: v1_gestion_commandes_partial_update
      description: |-
        [À FAIRE] Fiche complète d'une commande, avec alertes calculées :
        même empreinte de capture ou même référence de transaction sur une autre
        commande, stock insuffisant.
      summary: Modifier la note interne
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteInterneRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNoteInterneRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNoteInterneRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandeDetail'
          description: ''
  /api/v1/gestion/commandes/{id}/annuler-decision/:
    post:
      operationId: gestion_commande_annuler_decision
      description: VALIDEE ou POLO_DISPONIBLE → EN_ATTENTE. Administrateur uniquement,
        `motif` obligatoire.
      summary: Annuler une décision (administrateur)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Action appliquée
        '400':
          description: Motif manquant
        '403':
          description: Rôle insuffisant
        '404':
          description: Commande introuvable
        '409':
          description: Statut incompatible ou stock insuffisant
  /api/v1/gestion/commandes/{id}/capture/:
    get:
      operationId: v1_gestion_commandes_capture_retrieve
      description: |-
        [À FAIRE] Renvoie le fichier de la capture actuelle (FileResponse),
        uniquement aux gestionnaires. Journaliser l'accès.
      summary: Télécharger la capture de paiement
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Fichier JPG, PNG ou PDF
  /api/v1/gestion/commandes/{id}/demander-complement/:
    post:
      operationId: gestion_commande_demander_complement
      description: EN_ATTENTE → A_CORRIGER. `motif` obligatoire.
      summary: Demander un complément
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Action appliquée
        '400':
          description: Motif manquant
        '403':
          description: Rôle insuffisant
        '404':
          description: Commande introuvable
        '409':
          description: Statut incompatible ou stock insuffisant
  /api/v1/gestion/commandes/{id}/marquer-disponible/:
    post:
      operationId: gestion_commande_marquer_disponible
      description: VALIDEE → POLO_DISPONIBLE.
      summary: Polo prêt / disponible
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Action appliquée
        '400':
          description: Motif manquant
        '403':
          description: Rôle insuffisant
        '404':
          description: Commande introuvable
        '409':
          description: Statut incompatible ou stock insuffisant
  /api/v1/gestion/commandes/{id}/marquer-remis/:
    post:
      operationId: gestion_commande_marquer_remis
      description: VALIDEE ou POLO_DISPONIBLE → REMIS.
      summary: Marquer les polos remis
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Action appliquée
        '400':
          description: Motif manquant
        '403':
          description: Rôle insuffisant
        '404':
          description: Commande introuvable
        '409':
          description: Statut incompatible ou stock insuffisant
  /api/v1/gestion/commandes/{id}/refuser/:
    post:
      operationId: gestion_commande_refuser
      description: EN_ATTENTE → REFUSEE. `motif` obligatoire.
      summary: Refuser une commande
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Action appliquée
        '400':
          description: Motif manquant
        '403':
          description: Rôle insuffisant
        '404':
          description: Commande introuvable
        '409':
          description: Statut incompatible ou stock insuffisant
  /api/v1/gestion/commandes/{id}/valider/:
    post:
      operationId: gestion_commande_valider
      description: EN_ATTENTE → VALIDEE. Bloqué si stock insuffisant.
      summary: Valider une commande
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Gestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Action appliquée
        '400':
          description: Motif manquant
        '403':
          description: Rôle insuffisant
        '404':
          description: Commande introuvable
        '409':
          description: Statut incompatible ou stock insuffisant
  /api/v1/gestion/commandes/export/:
    get:
      operationId: v1_gestion_commandes_export_retrieve
      description: |-
        [À FAIRE] Export CSV de la liste filtrée (mêmes filtres que la liste),
        une ligne par polo commandé. Journaliser l'export.
      summary: Exporter les commandes (CSV)
      tags:
      - Gestion
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Fichier CSV
  /api/v1/gestion/tableau-de-bord/:
    get:
      operationId: v1_gestion_tableau_de_bord_retrieve
      description: '[À FAIRE] Compteurs par statut, montants, stock par combinaison.'
      summary: Tableau de bord
      tags:
      - Gestion
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableauDeBord'
          description: ''
  /api/v1/sante/:
    get:
      operationId: v1_sante_retrieve
      description: Vérifie que l'API et la base répondent (pour la surveillance du
        site).
      summary: État du service
      tags:
      - Technique
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
          description: ''
  /api/v1/suivi/:
    post:
      operationId: v1_suivi_create
      description: |-
        [À FAIRE] Renvoie l'état d'une commande à partir du code ET de l'email.
        Si le couple ne correspond pas : 404 avec un message générique.
      summary: Suivre ma commande
      tags:
      - Public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuiviRequeteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuiviRequeteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuiviRequeteRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suivi'
          description: ''
        '404':
          description: Commande introuvable
  /api/v1/suivi/capture/:
    post:
      operationId: v1_suivi_capture_create
      description: |-
        [À FAIRE] L'acheteur renvoie une capture quand sa commande est « À corriger ».
        Crée une nouvelle Capture puis appelle appliquer_transition(RENVOYER_CAPTURE).
      summary: Renvoyer une capture de paiement
      tags:
      - Public
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RenvoiCaptureRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suivi'
          description: ''
        '404':
          description: No response body
        '409':
          description: Commande pas à corriger
components:
  schemas:
    ActionEnum:
      enum:
      - SOUMETTRE
      - VALIDER
      - REFUSER
      - DEMANDER_COMPLEMENT
      - RENVOYER_CAPTURE
      - MARQUER_DISPONIBLE
      - MARQUER_REMIS
      - ANNULER_DECISION
      - CLOTURER
      type: string
      description: |-
        * `SOUMETTRE` - Commande envoyée
        * `VALIDER` - Validation
        * `REFUSER` - Refus
        * `DEMANDER_COMPLEMENT` - Complément demandé
        * `RENVOYER_CAPTURE` - Nouvelle capture envoyée
        * `MARQUER_DISPONIBLE` - Polo disponible
        * `MARQUER_REMIS` - Polos remis
        * `ANNULER_DECISION` - Décision annulée
        * `CLOTURER` - Clôture automatique
    Alerte:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        message:
          type: string
        commandes_liees:
          type: array
          items:
            type: string
          description: Codes de suivi
      required:
      - code
      - commandes_liees
      - message
    BlankEnum:
      enum:
      - ''
    Capture:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type_mime:
          type: string
          maxLength: 50
        taille_octets:
          type: integer
          maximum: 2147483647
          minimum: 0
        date_envoi:
          type: string
          format: date-time
          readOnly: true
        url_telechargement:
          type: string
          description: 'URL authentifiée : /api/v1/gestion/commandes/{id}/capture/'
      required:
      - date_envoi
      - id
      - taille_octets
      - type_mime
      - url_telechargement
    Catalogue:
      type: object
      properties:
        ventes_ouvertes:
          type: boolean
        date_ouverture:
          type: string
          format: date-time
          nullable: true
        date_cloture:
          type: string
          format: date-time
          nullable: true
        quantite_max_par_ligne:
          type: integer
        modeles:
          type: array
          items:
            $ref: '#/components/schemas/Choix'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Choix'
        manches:
          type: array
          items:
            $ref: '#/components/schemas/Choix'
        tailles:
          type: array
          items:
            $ref: '#/components/schemas/Choix'
        moyens_paiement:
          type: array
          items:
            $ref: '#/components/schemas/Choix'
        tarifs:
          type: array
          items:
            $ref: '#/components/schemas/Tarif'
        disponibilites:
          type: array
          items:
            $ref: '#/components/schemas/Disponibilite'
          description: Uniquement les combinaisons qui ont un stock limité. Une combinaison
            absente de la liste n'a pas de limite.
        numeros_depot:
          type: array
          items:
            $ref: '#/components/schemas/NumeroDepot'
          description: Numéros actifs uniquement
      required:
      - date_cloture
      - date_ouverture
      - disponibilites
      - manches
      - modeles
      - moyens_paiement
      - numeros_depot
      - quantite_max_par_ligne
      - tailles
      - tarifs
      - ventes_ouvertes
      - versions
    Choix:
      type: object
      properties:
        valeur:
          type: string
          description: Valeur technique à renvoyer à l'API, ex. BRODE
        libelle:
          type: string
          description: Texte à afficher, ex. Brodé
      required:
      - libelle
      - valeur
    CodeEnum:
      enum:
      - CAPTURE_DEJA_UTILISEE
      - REFERENCE_DEJA_UTILISEE
      - STOCK_INSUFFISANT
      type: string
      description: |-
        * `CAPTURE_DEJA_UTILISEE` - CAPTURE_DEJA_UTILISEE
        * `REFERENCE_DEJA_UTILISEE` - REFERENCE_DEJA_UTILISEE
        * `STOCK_INSUFFISANT` - STOCK_INSUFFISANT
    CommandeCreationRequest:
      type: object
      description: Corps de POST /api/v1/commandes/ (multipart/form-data).
      properties:
        nom:
          type: string
          minLength: 1
          pattern: ^[A-Za-z\u00c0-\u00d6\u00d8-\u00f6\u00f8-\u00ff' \-]{2,60}$
          maxLength: 60
        prenoms:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
          minLength: 1
        email_confirmation:
          type: string
          format: email
          minLength: 1
        lignes:
          type: string
          description: 'Chaîne JSON : liste de lignes {modele, version, manches, taille,
            quantite}'
          example: '[{"modele":"LICENCE","version":"BRODE","manches":"COURTES","taille":"M","quantite":1}]'
        moyen_paiement:
          $ref: '#/components/schemas/MoyenPaiementEnum'
        numero_envoi:
          type: string
          minLength: 1
          pattern: ^\+?[0-9]{8,15}$
          maxLength: 20
        reference_transaction:
