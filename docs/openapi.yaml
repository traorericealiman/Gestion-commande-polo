      required:
      - contact
      - horaires
      - lieu
    RoleEnum:
      enum:
      - TRESORIERE
      - ADMIN
      type: string
      description: |-
        * `TRESORIERE` - Trésorière
        * `ADMIN` - Administrateur
    Sante:
      type: object
      properties:
        statut:
          type: string
      required:
      - statut
    StatutEnum:
      enum:
      - EN_ATTENTE
      - A_CORRIGER
      - VALIDEE
      - POLO_DISPONIBLE
      - REMIS
      - REFUSEE
      - CLOTUREE
      type: string
      description: |-
        * `EN_ATTENTE` - En attente de vérification
        * `A_CORRIGER` - À corriger
        * `VALIDEE` - Validée
        * `POLO_DISPONIBLE` - Polo disponible
        * `REMIS` - Remis
        * `REFUSEE` - Refusée
        * `CLOTUREE` - Clôturée
    StockLigne:
      type: object
      properties:
        modele:
          type: string
        version:
          type: string
        manches:
          type: string
        taille:
          type: string
        demande:
          type: integer
          description: Toutes commandes non refusées / clôturées
        valide:
          type: integer
        remis:
          type: integer
        restant:
          type: integer
          nullable: true
          description: null = pas de limite
      required:
      - demande
      - manches
      - modele
      - remis
      - restant
      - taille
      - valide
      - version
    Suivi:
      type: object
      description: Réponse de POST /api/v1/suivi/.
      properties:
        code_suivi:
          type: string
        statut:
          $ref: '#/components/schemas/StatutEnum'
        statut_libelle:
          type: string
        montant_total:
          type: integer
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LigneSortie'
        date_creation:
          type: string
          format: date-time
        motif:
          oneOf:
          - $ref: '#/components/schemas/MotifEnum'
          - $ref: '#/components/schemas/BlankEnum'
        motif_libelle:
          type: string
        commentaire:
          type: string
          description: Message de la trésorière
        retrait:
          allOf:
          - $ref: '#/components/schemas/Retrait'
          nullable: true
          description: Rempli seulement quand le statut est POLO_DISPONIBLE
        peut_renvoyer_capture:
          type: boolean
          description: Vrai si statut = A_CORRIGER
      required:
      - code_suivi
      - commentaire
      - date_creation
      - lignes
      - montant_total
      - motif
      - motif_libelle
      - peut_renvoyer_capture
      - retrait
      - statut
      - statut_libelle
    SuiviRequeteRequest:
      type: object
      description: |-
        Le code seul ne suffit pas (codes séquentiels donc devinables) :
        il faut aussi l'email utilisé lors de la commande.
      properties:
        code_suivi:
          type: string
          minLength: 1
          maxLength: 20
        email:
          type: string
          format: email
          minLength: 1
      required:
      - code_suivi
      - email
    TableauDeBord:
      type: object
      properties:
        compteurs:
          type: object
