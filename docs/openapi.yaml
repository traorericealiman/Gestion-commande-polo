        modele:
          type: string
        version:
          type: string
        manches:
          type: string
        taille:
          type: string
        restant:
          type: integer
          description: '0 = épuisé : griser la taille'
      required:
      - manches
      - modele
      - restant
      - taille
      - version
    Evenement:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
