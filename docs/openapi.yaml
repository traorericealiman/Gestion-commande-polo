      description: |-
        * `S` - S
        * `M` - M
        * `L` - L
        * `XL` - XL
        * `XXL` - XXL
    Tarif:
      type: object
      properties:
        modele:
          type: string
        version:
          type: string
        manches:
          type: string
        prix:
          type: integer
          description: Prix unitaire en FCFA
      required:
      - manches
      - modele
      - prix
      - version
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    VersionEnum:
      enum:
      - SIMPLE
      - BRODE
      type: string
      description: |-
        * `SIMPLE` - Simple
        * `BRODE` - Brodé
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
