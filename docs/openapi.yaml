      type: object
      description: |-
        Corps des actions de gestion. `motif` est obligatoire pour refuser,
        demander un complément et annuler une décision.
      properties:
        motif:
          oneOf:
          - $ref: '#/components/schemas/MotifEnum'
          - $ref: '#/components/schemas/BlankEnum'
        commentaire:
          type: string
          maxLength: 1000
    DeconnexionRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
