name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: polo_esatic
          POSTGRES_USER: polo
          POSTGRES_PASSWORD: polo_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polo -d polo_esatic"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      DATABASE_URL: postgres://polo:polo_ci_password@localhost:5432/polo_esatic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Contrat d'API valide
        run: python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn

      - name: Tests
        run: python manage.py test
